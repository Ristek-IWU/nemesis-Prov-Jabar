name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main # Workflow jalan saat push ke branch main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: 🔍 Check Secrets
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "ERROR: FTP_SERVER secret is empty!"; exit 1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "ERROR: FTP_USERNAME secret is empty!"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "ERROR: FTP_PASSWORD secret is empty!"; exit 1; fi

      - name: 🚀 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          # Kita hanya mengirim file yang diperlukan untuk running
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            scripts/**
            scratch/**
            src/frontend/**
            seed/**
            data/*.sqlite
            data/*.sql
            *.md
